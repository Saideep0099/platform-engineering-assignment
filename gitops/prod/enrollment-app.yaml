apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: enrollment-service-prod
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://git.example.com/platform/gitops-config.git
    targetRevision: main
    path: apps/enrollment-service/overlays/prod
    helm:
      valueFiles:
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: enrollment
  syncPolicy:
    # NO automated sync in prod: image tag promotion happens via reviewed PR,
    # then a human (or approved pipeline stage) triggers the sync.
    syncOptions:
      - CreateNamespace=true
