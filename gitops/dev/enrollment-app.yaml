# ArgoCD Application — dev auto-syncs; prod (below) requires manual sync/PR approval
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: enrollment-service-dev
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://git.example.com/platform/gitops-config.git
    targetRevision: main
    path: apps/enrollment-service/overlays/dev
    helm:
      valueFiles:
        - values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: enrollment
  syncPolicy:
    automated:
      prune: true       # delete resources removed from Git
      selfHeal: true    # revert manual kubectl drift
    syncOptions:
      - CreateNamespace=true
