apiVersion: v1
kind: Service
metadata:
  name: {{ include "enrollment.name" . }}
  labels:
    {{- include "enrollment.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
  selector:
    {{- include "enrollment.selectorLabels" . | nindent 4 }}
